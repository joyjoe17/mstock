version: "3.9"

services:

  api:
    build: .
    container_name: prop_api
    restart: always
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8001:8000"

  postgres:
    image: postgres:15
    container_name: prop_postgres
    restart: always
    environment:
      POSTGRES_DB: propdesk
      POSTGRES_USER: propuser
      POSTGRES_PASSWORD: strongpassword
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: prop_redis
    restart: always

volumes:
  pgdata: